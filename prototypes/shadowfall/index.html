// Shadowfall: a dark 16-bit pixel action roguelite. One warrior, one torch-lit arena, five waves
// and the Shadow Warden. Every figure is pixel art drawn from the maps below; nothing is emoji.

// ---- Built to be checked ----------------------------------------------------------------
const params = new URLSearchParams(location.search);
const tune = new Proxy({}, { get: (_, k) => CONFIG[k].value }); // live: tune.speed is CONFIG.speed.value
const STEP = 1 / 60;            // simulation step in seconds; motion is per second, never per frame
const W = 480, H = 270;         // logical size: the pixel look's native resolution
const PIXEL = true;             // pixel look: whole-number scale, no smoothing
const FONT = '"Trebuchet MS", "Segoe UI", Tahoma, sans-serif';
const SERIF = '"Palatino Linotype", "Book Antiqua", Cambria, "Times New Roman", serif'; // full Vietnamese diacritics
const TITLE = 'SHADOWFALL';
const CONTROLS = ['WASD: di chuyển', 'Chuột: ngắm hướng chém', 'Chuột trái (giữ): chém kiếm',
  'Space: lướt né', 'E: Lốc xoáy bóng tối', 'Esc / P: tạm dừng · M: tắt tiếng']; // shown on the title screen
const clock = window.GAME_CLOCK || { now: () => performance.now() / 1000 }; // a check may inject one
const CHEAP = params.get('render') === 'cheap'; // a headless shot or check: 3D draws cheap; players never see it
let seed;
function rng() { // mulberry32; every gameplay random call reads this, never Math.random
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), seed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const events = []; // window.game.events: anything the game wants a run to see
let drawSeed = 7;  // looks only (screen shake): never touches the gameplay rng
function drawRand() { drawSeed = (drawSeed * 16807) % 2147483647; return drawSeed / 2147483647; }

// ---- Screen ---------------------------------------------------------------------------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let SCALE = 1;
function fit() { // whole-number scale of the 480x270 view; the canvas keeps full resolution for crisp text
  const k = Math.min(innerWidth / W, innerHeight / H);
  const s = Math.max(1, Math.floor(k));
  const r = s * (devicePixelRatio || 1);
  canvas.width = Math.round(W * r); canvas.height = Math.round(H * r);
  canvas.style.width = W * s + 'px'; canvas.style.height = H * s + 'px';
  canvas.style.marginTop = Math.max(0, Math.floor((innerHeight - H * s) / 2)) + 'px';
  canvas.style.imageRendering = 'pixelated';
  ctx.setTransform(r, 0, 0, r, 0, 0); ctx.imageSmoothingEnabled = false; SCALE = r;
}
addEventListener('resize', fit); fit();
function mk(w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); g.imageSmoothingEnabled = false; return [c, g];
}

const [lc, lg] = mk(W, H);        // the light map
function clear(c) { ctx.fillStyle = c; ctx.fillRect(0, 0, W, H); }
function text(s, x, y, size, c, align = 'center', o = {}) {
  ctx.font = `${o.bold ? 'bold ' : ''}${size}px ${o.font || FONT}`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = size * SCALE * 0.5; }
  if (o.stroke !== false) {
    ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(0.7, Math.min(2, size / 7));
    ctx.strokeStyle = o.stroke || 'rgba(4,2,10,0.92)'; ctx.strokeText(s, x, y);
  }
  ctx.fillStyle = c; ctx.fillText(s, x, y);
  ctx.shadowBlur = 0;
}
function wrap(s, maxW, size, bold) {
  ctx.font = `${bold ? 'bold ' : ''}${size}px ${FONT}`;
  const words = s.split(' '), lines = []; let line = '';
  for (const w of words) {
    const t = line ? line + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t;
  }
  if (line) lines.push(line);
  return lines;
}

const down = new Set(), hit = new Set();

addEventListener('keydown', e => {
  startAudio();
  if (!e.repeat) { down.add(e.code); hit.add(e.code); }
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();

addEventListener('keyup', e => down.delete(e.code));
function toLogical(e) {
  const r = canvas.getBoundingClientRect();
  if (!r.width) return;
  mouse.x = (e.clientX - r.left) / r.width * W; mouse.y = (e.clientY - r.top) / r.height * H; mouse.moved = true;
}
addEventListener('pointermove', toLogical);
addEventListener('pointerdown', e => {
  startAudio(); toLogical(e);
  if (e.button === 0) { down.add('Mouse0'); hit.add('Mouse0'); }
});
addEventListener('pointerup', e => { if (e.button === 0) down.delete('Mouse0'); });

addEventListener('blur', () => down.clear());

// ---- Audio: started on first input, mute on M --------------------------------------------
let audio = null, muted = false;
function startAudio() {
  if (!audio) {
    const ac = window.GAME_AUDIO || new (window.AudioContext || window.webkitAudioContext)(); // a check may inject one
    const out = ac.createGain(); out.gain.value = muted ? 0 : tune.volume;
    out.connect(ac.destination); audio = { ac, out };
  }
  if (audio.ac.state === 'suspended') audio.ac.resume();
}
function setMuted(m) { muted = m; if (audio) audio.out.gain.value = m ? 0 : tune.volume; }
addEventListener('tune', () => setMuted(muted)); // the tweak panel (an add-on), when added, moved a value: the volume follows
function tone(freq, dur, type = 'square', vol = 0.3, delay = 0) {
  if (!audio || muted) return;
  const t = audio.ac.currentTime + delay, o = audio.ac.createOscillator(), g = audio.ac.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(audio.out); o.start(t); o.stop(t + dur);
}
function sweep(f0, f1, dur, type = 'sawtooth', vol = 0.2, delay = 0) {
  if (!audio || muted) return;
  const t = audio.ac.currentTime + delay, o = audio.ac.createOscillator(), g = audio.ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + Math.min(0.03, dur / 4));
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(audio.out); o.start(t); o.stop(t + dur + 0.02);
}
let noiseBuf = null, noiseN = 0;
function noise(dur, f0, f1, q, vol, type = 'bandpass', delay = 0) {
  if (!audio || muted) return;
  const ac = audio.ac;
  if (!noiseBuf) {
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); let s = 12345;
    for (let i = 0; i < d.length; i++) { s = (s * 1103515245 + 12345) & 0x7fffffff; d[i] = s / 0x3fffffff - 1; }
  }
  const t = ac.currentTime + delay, src = ac.createBufferSource(); src.buffer = noiseBuf;
  const f = ac.createBiquadFilter(); f.type = type; f.Q.value = q;
  f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
  const g = ac.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(f).connect(g).connect(audio.out);
  noiseN = (noiseN + 0.137) % 0.8; src.start(t, noiseN); src.stop(t + dur + 0.02);
}

function sfx(name) {
  const now = clock.now(), gap = { hit: 0.04, xp: 0.035, slash: 0.05, arrow: 0.08, tick: 0.09 }[name] || 0;
  if (now - (sfxLast[name] || -9) < gap) return; sfxLast[name] = now;
  switch (name) {
    case 'slash': noise(0.13, 3200, 700, 0.9, 0.22); break;
    case 'heavy': noise(0.2, 2400, 300, 0.7, 0.3); sweep(220, 90, 0.18, 'triangle', 0.12); break;
    case 'hit': tone(150, 0.07, 'square', 0.12); noise(0.06, 1400, 500, 1.2, 0.18); break;
    case 'kill': sweep(160, 50, 0.22, 'sawtooth', 0.12); noise(0.22, 900, 120, 0.7, 0.2, 'lowpass'); break;
    case 'dash': noise(0.16, 600, 2800, 0.8, 0.16); break;
    case 'whirl':

    case 'hurt': sweep(220, 60, 0.28, 'sawtooth', 0.28); noise(0.15, 800, 200, 0.8, 0.2, 'lowpass'); break;
    case 'xp': tone(1040 + (sfxLast.xpn = ((sfxLast.xpn || 0) + 1) % 6) * 80, 0.06, 'sine', 0.05); break;
    case 'level': [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.25, 'triangle', 0.14, i * 0.07)); break;
    case 'card': tone(392, 0.12, 'triangle', 0.12); tone(784, 0.2, 'triangle', 0.1, 0.06); break;

    case 'orb': sweep(500, 180, 0.3, 'sine', 0.12); break;

    case 'portal': sweep(80, 160, 0.4, 'sine', 0.05); break;
    case 'clear': [392, 523, 659].forEach((f, i) => tone(f, 0.6, 'triangle', 0.12, i * 0.09)); break;
    case 'wave': sweep(70, 55, 0.9, 'sawtooth', 0.16); tone(110, 0.9, 'triangle', 0.1); break;
    case 'win': [392, 494, 587, 784, 988].forEach((f, i) => tone(f, 0.7, 'triangle', 0.13, i * 0.12)); break;
    case 'lose': [330, 262, 196, 131].forEach((f, i) => tone(f, 0.6, 'sawtooth', 0.1, i * 0.18)); break;
    case 'buy': tone(660, 0.1, 'square', 0.08); tone(990, 0.15, 'square', 0.06, 0.06); break;

// ---- Pixel art ----------------------------------------------------------------------------
// Each map is drawn pixel by pixel; the outline is traced around it (dark for the warrior,
// blood red for the monsters), so every figure keeps one pixel density and one outline rule.
function sprite(rows, pal, outline) {
  const h = rows.length, w = Math.max(...rows.map(r => r.length)), cw = w + 2, ch = h + 2;
  const [c, g] = mk(cw, ch); const filled = new Uint8Array(cw * ch); const eyes = [];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const k = rows[y][x];
    if (k && pal[k]) {
      g.fillStyle = pal[k]; g.fillRect(x + 1, y + 1, 1, 1); filled[(y + 1) * cw + x + 1] = 1;
      if (k === 'r' || k === 'b') eyes.push([x + 1, y + 1]);
    }
  }
  if (outline) {
    g.fillStyle = outline;
    for (let y = 0; y < ch; y++) for (let x = 0; x < cw; x++) {
      if (filled[y * cw + x]) continue;
      if ((x > 0 && filled[y * cw + x - 1]) || (x < cw - 1 && filled[y * cw + x + 1]) ||
          (y > 0 && filled[(y - 1) * cw + x]) || (y < ch - 1 && filled[(y + 1) * cw + x])) g.fillRect(x, y, 1, 1);
    }
  }
  const s = { c, w: cw, h: ch, eyes };
  s.white = tint(c, '#ffffff'); s.flip = flipC(c); s.flipW = flipC(s.white);
  return s;
}
function tint(src, col) {
  const [c, g] = mk(src.width, src.height); g.drawImage(src, 0, 0);
  g.globalCompositeOperation = 'source-in'; g.fillStyle = col; g.fillRect(0, 0, c.width, c.height); return c;
}
function flipC(src) {
  const [c, g] = mk(src.width, src.height); g.translate(src.width, 0); g.scale(-1, 1); g.drawImage(src, 0, 0); return c;
}
function drawSpr(g, s, x, y, flip, white) { // x, y: the figure's feet
  const img = white ? (flip ? s.flipW : s.white) : (flip ? s.flip : s.c);
  g.drawImage(img, Math.round(x - s.w / 2), Math.round(y - s.h + 1));
}

        wrap(c.name, r.w - 12, 9, true).forEach((l, j) => text(l, r.x + r.w / 2, y + 56 + j * 11, 9, '#ffffff', 'center', { bold: true }));
        wrap(c.desc(), r.w - 16, 7).forEach((l, j) => text(l, r.x + r.w / 2, y + 84 + j * 10, 7, '#cfc6e8'));
        if (c.id !== 'potion') {
          for (let k = 0; k < c.max; k++) { ctx.fillStyle = k < lv ? '#ffd27a' : k === lv ? '#b07cff' : '#3a2a50'; ctx.fillRect(r.x + r.w / 2 - c.max * 4 + k * 8 + 1, y + r.h - 14, 6, 4); }
          text(lv ? `Cấp ${lv} → ${lv + 1}` : 'Mới', r.x + r.w / 2, y + r.h - 22, 6, '#9a8cc0');
        }
      });
      drawCursor();
    },
  },
  pause: {
    update() {
      if (pressed('KeyP') || pressed('Escape')) scene = 'play';
      else if (pressed('KeyQ')) { reset(); scene = 'title'; }
    },
    draw() {
      scenes.play.draw();
      ctx.fillStyle = 'rgba(4,2,10,0.7)'; ctx.fillRect(0, 0, W, H);
      text('TẠM DỪNG', W / 2, 60, 22, '#e8dcff', 'center', { bold: true, font: SERIF, glow: 'rgba(160,100,255,0.8)' });
      CONTROLS.forEach((c, i) => text(c, W / 2, 96 + i * 15, 8, '#cfc6e8'));
      text('Esc / P: chơi tiếp  ·  Q: bỏ lượt, về sảnh', W / 2, 200, 8, '#ffe8b0', 'center', { bold: true });
    },
  },
  over: { update: endUpdate, draw() { endScreen(false); } },
  results: { update: endUpdate, draw() { endScreen(true); } },
};

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1; // ALPHA: how far the frame is between the last two steps
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now; // a stall never fast-forwards the game
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP; // draw between steps, so the view never judders
  drawFrame();
}
function drawFrame() {
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0); ctx.imageSmoothingEnabled = false;
  scenes[scene].draw();
  if (muted) text('Đã tắt tiếng (M)', W - 8, H - 8, 6, '#9a8cc0', 'right');
}
function frame_() { tick(); requestAnimationFrame(frame_); }
// A headless browser on a time budget runs timers but almost no animation frames: a timer
// ticks when no frame has come for 100 ms on a visible page; a hidden tab stays paused.
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; }, // the loop steps; a check empties it
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame_); setInterval(timer, 50); }
</script>
</body>
</html>
